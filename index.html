<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f7;
      color: #333;
    }

    h1 {
      text-align: center;
    }

    .form-container {
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000015;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 16px;
      margin-top: 15px;
      border: none;
      border-radius: 5px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .wishlist-section {
      border-top: 1px solid #ddd;
      margin-top: 20px;
      padding-top: 10px;
    }

    .preview {
      display: none;
      max-width: 150px;
      max-height: 150px;
      object-fit: contain;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 30px;
      background: white;
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
      vertical-align: top;
    }

    th {
      background: #2563eb;
      color: white;
    }

    .wishlist-cell img {
      display: block;
      max-width: 120px;
      max-height: 120px;
      object-fit: contain;
      margin: 8px auto;
    }

    .wishlist-cell a {
      display: inline-block;
      margin-top: 5px;
      color: #2563eb;
      word-break: break-word;
    }

    .empty {
      color: #999;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <h1>My Wishlist</h1>

  <div class="form-container">
    <form id="wishlistForm">

      <label for="number">Number (1–12)</label>
      <input
        type="number"
        id="number"
        min="1"
        max="12"
        step="1"
        required
      >

      <div class="wishlist-section">
        <h3>Wishlist 1</h3>

        <label for="description1">Description</label>
        <input type="text" id="description1" required>

        <label for="link1">Link</label>
        <input type="url" id="link1" placeholder="https://example.com" required>

        <label for="picture1">Picture URL</label>
        <input type="url" id="picture1" placeholder="Direct image URL" required>
        <img id="preview1" class="preview" alt="Wishlist 1 preview">
      </div>

      <div class="wishlist-section">
        <h3>Wishlist 2</h3>

        <label for="description2">Description</label>
        <input type="text" id="description2" required>

        <label for="link2">Link</label>
        <input type="url" id="link2" placeholder="https://example.com" required>

        <label for="picture2">Picture URL</label>
        <input type="url" id="picture2" placeholder="Direct image URL" required>
        <img id="preview2" class="preview" alt="Wishlist 2 preview">
      </div>

      <div class="wishlist-section">
        <h3>Wishlist 3</h3>

        <label for="description3">Description</label>
        <input type="text" id="description3" required>

        <label for="link3">Link</label>
        <input type="url" id="link3" placeholder="https://example.com" required>

        <label for="picture3">Picture URL</label>
        <input type="url" id="picture3" placeholder="Direct image URL" required>
        <img id="preview3" class="preview" alt="Wishlist 3 preview">
      </div>

      <button type="submit" id="saveButton">Save Wishlist</button>
      <p id="status" class="status"></p>
    </form>
  </div>

  <h2>Wishlist Records</h2>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Number</th>
          <th>Wishlist 1</th>
          <th>Wishlist 2</th>
          <th>Wishlist 3</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody id="wishlistTable">
        <tr>
          <td colspan="5">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      get,
      onValue
    } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    // Replace with your existing Firebase configuration.
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://wishlist-a9da8-default-rtdb.firebaseio.com",
      projectId: "wishlist-a9da8",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const wishlistRef = ref(db, "wishlist_items");

    const form = document.getElementById("wishlistForm");
    const saveButton = document.getElementById("saveButton");
    const status = document.getElementById("status");
    const tableBody = document.getElementById("wishlistTable");

    // Only allow HTTP and HTTPS URLs.
    function isValidWebURL(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:";
      } catch {
        return false;
      }
    }

    // Test whether the URL actually loads an image.
    function testImageURL(value) {
      return new Promise((resolve) => {
        const image = new Image();

        image.onload = () => resolve(true);
        image.onerror = () => resolve(false);

        image.src = value;
      });
    }

    // Preview and validate each picture URL.
    for (let i = 1; i <= 3; i++) {
      const pictureInput = document.getElementById(`picture${i}`);
      const preview = document.getElementById(`preview${i}`);

      pictureInput.addEventListener("change", async () => {
        const url = pictureInput.value.trim();

        preview.style.display = "none";

        if (!url) return;

        if (!isValidWebURL(url)) {
          alert(`Wishlist ${i}: Please enter a valid HTTP or HTTPS URL.`);
          pictureInput.value = "";
          return;
        }

        status.textContent = `Checking Wishlist ${i} image...`;
        status.className = "status";

        const valid = await testImageURL(url);

        if (valid) {
          preview.src = url;
          preview.style.display = "block";
          status.textContent = "Image loaded successfully.";
          status.className = "status success";
        } else {
          alert(
            `Wishlist ${i}: The image could not be loaded. ` +
            `Please use a direct, publicly accessible image URL.`
          );

          pictureInput.value = "";
          preview.src = "";
          status.textContent = "Image validation failed.";
          status.className = "status error";
        }
      });
    }

    // Save or update a wishlist record.
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const number = Number(document.getElementById("number").value);

      if (!Number.isInteger(number) || number < 1 || number > 12) {
        alert("Please enter a whole number from 1 to 12.");
        return;
      }

      const wishes = [];

      for (let i = 1; i <= 3; i++) {
        const description =
          document.getElementById(`description${i}`).value.trim();

        const link =
          document.getElementById(`link${i}`).value.trim();

        const picture =
          document.getElementById(`picture${i}`).value.trim();

        if (!description || !link || !picture) {
          alert(`Please complete all fields in Wishlist ${i}.`);
          return;
        }

        if (!isValidWebURL(link) || !isValidWebURL(picture)) {
          alert(`Please enter valid HTTP or HTTPS URLs in Wishlist ${i}.`);
          return;
        }

        wishes.push({ description, link, picture });
      }

      saveButton.disabled = true;
      saveButton.textContent = "Checking images...";
      status.textContent = "Validating all three images...";
      status.className = "status";

      try {
        // Check all images again before saving.
        const imageChecks = await Promise.all(
          wishes.map(wish => testImageURL(wish.picture))
        );

        const failedIndex = imageChecks.findIndex(valid => !valid);

        if (failedIndex !== -1) {
          throw new Error(
            `Wishlist ${failedIndex + 1} has an image that cannot be loaded.`
          );
        }

        saveButton.textContent = "Saving...";

        const record = {
          number,
          wish1: wishes[0],
          wish2: wishes[1],
          wish3: wishes[2],
          timestamp: new Date().toLocaleString("en-PH", {
            timeZone: "Asia/Manila"
          }),
          updatedAt: Date.now()
        };

        // Same number updates the existing record.
        await set(ref(db, `wishlist_items/${number}`), record);

        status.textContent = `Wishlist for Number ${number} saved successfully!`;
        status.className = "status success";

        form.reset();

        for (let i = 1; i <= 3; i++) {
          const preview = document.getElementById(`preview${i}`);
          preview.src = "";
          preview.style.display = "none";
        }

      } catch (error) {
        status.textContent = error.message || "Unable to save wishlist.";
        status.className = "status error";
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Save Wishlist";
      }
    });

    // Display one row for each number, from 1 to 12.
    function renderTable(data) {
      tableBody.innerHTML = "";

      for (let number = 1; number <= 12; number++) {
        const record = data?.[number];
        const row = document.createElement("tr");

        const numberCell = document.createElement("td");
        numberCell.textContent = number;
        row.appendChild(numberCell);

        for (let i = 1; i <= 3; i++) {
          const cell = document.createElement("td");
          cell.className = "wishlist-cell";

          const wish = record?.[`wish${i}`];

          if (wish) {
            const description = document.createElement("div");
            description.textContent = wish.description || "";
            cell.appendChild(description);

            if (wish.link && isValidWebURL(wish.link)) {
              const link = document.createElement("a");
              link.href = wish.link;
              link.textContent = "View Link";
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              cell.appendChild(link);
            }

            if (wish.picture && isValidWebURL(wish.picture)) {
              const image = document.createElement("img");
              image.src = wish.picture;
              image.alt = wish.description || "Wishlist image";
              image.loading = "lazy";

              image.onerror = () => {
                image.remove();
                const note = document.createElement("div");
                note.className = "empty";
                note.textContent = "Image unavailable";
                cell.appendChild(note);
              };

              cell.appendChild(image);
            }
          } else {
            cell.innerHTML = '<span class="empty">—</span>';
          }

          row.appendChild(cell);
        }

        const timestampCell = document.createElement("td");
        timestampCell.textContent = record?.timestamp || "—";
        row.appendChild(timestampCell);

        tableBody.appendChild(row);
      }
    }

    // Listen for real-time Firebase updates.
    onValue(wishlistRef, (snapshot) => {
      renderTable(snapshot.val() || {});
    }, (error) => {
      tableBody.innerHTML =
        `<tr><td colspan="5">Unable to load data: ${error.message}</td></tr>`;
    });

  </script>

</body>
</html>
