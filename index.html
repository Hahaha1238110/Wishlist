```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wishlist App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1, h2 {
      color: #555;
      text-align: center;
    }

    /* FORM */

    form {
      margin: 20px auto 35px;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 450px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: left;
    }

    input[type="number"],
    input[type="url"],
    textarea {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    input[type="number"] {
      text-align: center;
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    button {
      display: block;
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      color: #fff;
      background-color: #28a745;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }

    /* WISHLIST GRID */

    .wishlist-container {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 25px auto;
    }

    /* EACH NUMBER HAS ONE BOX */

    .wishlist-card {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      min-width: 0;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
      overflow-wrap: anywhere;
    }

    .wishlist-card h3 {
      margin: 0 0 15px;
      padding-bottom: 10px;
      text-align: center;
      color: #28a745;
      border-bottom: 1px solid #eee;
      font-size: 20px;
    }

    .wishlist-description {
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .wishlist-link {
      display: inline-block;
      margin-bottom: 15px;
      color: #007bff;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .wishlist-link:hover {
      text-decoration: underline;
    }

    .wishlist-image {
      display: block;
      width: 100%;
      max-width: 250px;
      max-height: 250px;
      object-fit: contain;
      margin: 0 auto 12px;
      border-radius: 8px;
    }

    .wishlist-date {
      display: block;
      font-size: 11px;
      color: #777;
      margin-top: 12px;
    }

    .empty-message {
      color: #999;
      font-size: 14px;
      text-align: center;
      padding: 20px 5px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .card-actions button {
      padding: 8px;
      font-size: 13px;
    }

    .edit-button {
      background-color: #007bff;
    }

    .edit-button:hover {
      background-color: #0069d9;
    }

    .delete-button {
      background-color: #dc3545;
    }

    .delete-button:hover {
      background-color: #c82333;
    }

    /* RESPONSIVE LAYOUT */

    @media (max-width: 900px) {
      .wishlist-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .wishlist-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>My Wishlist</h1>

  <form id="wishlistForm">

    <label for="Number">Number (1–12):</label>

    <input
      type="number"
      id="Number"
      placeholder="Enter number 1–12"
      min="1"
      max="12"
      step="1"
      required
    >

    <label for="description">1. Description:</label>

    <textarea
      id="description"
      placeholder="Describe your wishlist item"
      required
    ></textarea>

    <label for="link">2. Link:</label>

    <input
      type="url"
      id="link"
      placeholder="Paste the product link (https://...)"
      required
    >

    <label for="picture">3. Picture URL:</label>

    <input
      type="url"
      id="picture"
      placeholder="Paste a direct image URL (https://...)"
      required
    >

    <button type="submit" id="submitButton">
      Add Wishlist
    </button>

  </form>

  <h2>All Wishlists</h2>

  <div id="wishlistContainer" class="wishlist-container">
    <p class="empty-message">Loading wishlists...</p>
  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      get,
      set,
      remove
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


    // ========================================
    // FIREBASE CONFIGURATION
    // ========================================

    const firebaseConfig = {
      apiKey: "AIzaSyAHZbilFupWzHDpovfLwS_UkeozIqrGaUs",
      authDomain: "wishlist-a9da8.firebaseapp.com",
      databaseURL: "https://wishlist-a9da8-default-rtdb.firebaseio.com",
      projectId: "wishlist-a9da8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);


    // ========================================
    // ELEMENTS
    // ========================================

    const form = document.getElementById("wishlistForm");
    const numberInput = document.getElementById("Number");
    const descriptionInput = document.getElementById("description");
    const linkInput = document.getElementById("link");
    const pictureInput = document.getElementById("picture");
    const container = document.getElementById("wishlistContainer");
    const submitButton = document.getElementById("submitButton");

    const wishlistPath = "wishlist_items";


    // ========================================
    // URL VALIDATION
    // ========================================

    function safeURL(value) {
      try {
        const url = new URL(value);

        if (
          url.protocol === "https:" ||
          url.protocol === "http:"
        ) {
          return url.href;
        }

        return "";
      } catch {
        return "";
      }
    }


    // ========================================
    // PHILIPPINE DATE AND TIME
    // ========================================

    function getPhilippineTime() {
      return new Date().toLocaleString("en-PH", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true,
        timeZone: "Asia/Manila"
      });
    }


    // ========================================
    // SAVE OR UPDATE WISHLIST
    // ========================================

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const number = Number(numberInput.value);
      const description = descriptionInput.value.trim();
      const link = linkInput.value.trim();
      const picture = pictureInput.value.trim();

      // Validate number

      if (
        !Number.isInteger(number) ||
        number < 1 ||
        number > 12
      ) {
        alert("Please enter a whole number from 1 to 12.");
        numberInput.focus();
        return;
      }

      // Validate required fields

      if (!description || !link || !picture) {
        alert("Please complete all three fields.");
        return;
      }

      // Validate URLs

      const validLink = safeURL(link);
      const validPicture = safeURL(picture);

      if (!validLink) {
        alert("Please enter a valid product link beginning with http:// or https://.");
        linkInput.focus();
        return;
      }

      if (!validPicture) {
        alert("Please enter a valid picture URL beginning with http:// or https://.");
        pictureInput.focus();
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Saving...";

      try {

        const itemRef = ref(db, `${wishlistPath}/${number}`);

        // Check if the number already has an entry

        const existingSnapshot = await get(itemRef);

        const previousData = existingSnapshot.exists()
          ? existingSnapshot.val()
          : null;

        const wishlistData = {
          name: String(number),
          description: description,
          link: validLink,
          picture: validPicture,
          timestamp: getPhilippineTime()
        };

        // Preserve the original date when editing an existing entry

        if (previousData && previousData.timestamp) {
          wishlistData.timestamp = previousData.timestamp;
          wishlistData.updatedAt = getPhilippineTime();
        }

        await set(itemRef, wishlistData);

        alert(
          previousData
            ? `Wishlist Number ${number} updated successfully!`
            : `Wishlist Number ${number} saved successfully!`
        );

        form.reset();

        await loadWishlists();

      } catch (error) {

        console.error("Error saving wishlist:", error);

        alert(
          "Unable to save the wishlist. Please check your internet connection and Firebase database permissions."
        );

      } finally {

        submitButton.disabled = false;
        submitButton.textContent = "Add Wishlist";

      }

    });


    // ========================================
    // CREATE A WISHLIST CARD
    // ========================================

    function createWishlistCard(number, item) {

      const card = document.createElement("div");
      card.className = "wishlist-card";

      const heading = document.createElement("h3");
      heading.textContent = `Number ${number}`;
      card.appendChild(heading);

      if (!item) {

        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent = "No wishlist added yet.";

        card.appendChild(empty);

        return card;
      }

      // Description

      const description = document.createElement("div");
      description.className = "wishlist-description";
      description.textContent = item.description || "No description.";

      card.appendChild(description);

      // Product link

      const linkURL = safeURL(item.link);

      if (linkURL) {

        const link = document.createElement("a");

        link.className = "wishlist-link";
        link.href = linkURL;
        link.textContent = "View Product Link";
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        card.appendChild(link);

      }

      // Picture

      const pictureURL = safeURL(item.picture);

      if (pictureURL) {

        const image = document.createElement("img");

        image.className = "wishlist-image";
        image.src = pictureURL;
        image.alt = `Wishlist Number ${number}`;
        image.loading = "lazy";

        image.onerror = function() {

          const errorMessage = document.createElement("p");

          errorMessage.className = "empty-message";
          errorMessage.textContent =
            "Picture unavailable. Please check the image URL.";

          this.replaceWith(errorMessage);

        };

        card.appendChild(image);

      }

      // Date added

      const date = document.createElement("small");

      date.className = "wishlist-date";

      date.textContent = item.updatedAt
        ? `Last updated: ${item.updatedAt}`
        : `Date added: ${item.timestamp || "N/A"}`;

      card.appendChild(date);

      // Edit and delete buttons

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const editButton = document.createElement("button");

      editButton.type = "button";
      editButton.className = "edit-button";
      editButton.textContent = "Edit";

      editButton.addEventListener("click", function() {

        numberInput.value = number;
        descriptionInput.value = item.description || "";
        linkInput.value = item.link || "";
        pictureInput.value = item.picture || "";

        submitButton.textContent = "Update Wishlist";

        form.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      });

      actions.appendChild(editButton);

      const deleteButton = document.createElement("button");

      deleteButton.type = "button";
      deleteButton.className = "delete-button";
      deleteButton.textContent = "Delete";

      deleteButton.addEventListener("click", async function() {

        const confirmed = confirm(
          `Are you sure you want to delete Wishlist Number ${number}?`
        );

        if (!confirmed) {
          return;
        }

        try {

          await remove(ref(db, `${wishlistPath}/${number}`));

          alert(`Wishlist Number ${number} deleted.`);

          await loadWishlists();

        } catch (error) {

          console.error("Error deleting wishlist:", error);

          alert("Unable to delete this wishlist. Please try again.");

        }

      });

      actions.appendChild(deleteButton);

      card.appendChild(actions);

      return card;
    }


    // ========================================
    // LOAD ALL 12 WISHLIST BOXES
    // ========================================

    async function loadWishlists() {

      container.innerHTML = "";

      try {

        const snapshot = await get(ref(db, wishlistPath));

        const data = snapshot.exists()
          ? snapshot.val()
          : {};

        // Always show Numbers 1 through 12

        for (let number = 1; number <= 12; number++) {

          const item = data[number] || null;

          const card = createWishlistCard(number, item);

          container.appendChild(card);

        }

      } catch (error) {

        console.error("Error loading wishlists:", error);

        container.innerHTML = "";

        const message = document.createElement("p");

        message.className = "empty-message";
        message.textContent =
          "Unable to load wishlists. Please check your connection and Firebase database permissions.";

        container.appendChild(message);

      }

    }


    // ========================================
    // INITIAL LOAD
    // ========================================

    loadWishlists();

  </script>

</body>
</html>
