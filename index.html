<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist App</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    color: #333;
    margin: 0;
    padding: 20px;
  }

  h1, h2 {
    text-align: center;
    color: #555;
  }

  form {
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  label {
    display: block;
    font-weight: bold;
    margin: 12px 0 6px;
  }

  input, textarea {
    width: 100%;
    padding: 11px;
    margin-bottom: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  textarea {
    height: 65px;
    resize: vertical;
  }

  .wish-section {
    padding: 12px;
    margin: 15px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
  }

  .wish-section h3 {
    margin-top: 0;
    color: #28a745;
  }

  button {
    padding: 10px 18px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
  }

  button:hover {
    background: #218838;
  }

  .table-wrapper {
    width: 100%;
    overflow-x: auto;
    margin-top: 20px;
  }

  table {
    width: 100%;
    min-width: 950px;
    border-collapse: collapse;
    background: white;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: left;
    vertical-align: top;
  }

  th {
    background: #f0f0f0;
    text-align: center;
  }

  td.Number {
    text-align: center;
    font-weight: bold;
    vertical-align: middle;
    width: 60px;
  }

  .wish-cell {
    min-width: 190px;
    max-width: 260px;
    overflow-wrap: anywhere;
  }

  .wish-description {
    white-space: pre-wrap;
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .wish-link {
    display: block;
    margin: 8px 0;
    color: #007bff;
  }

  .wish-image {
    display: block;
    max-width: 150px;
    max-height: 150px;
    width: auto;
    height: auto;
    object-fit: contain;
    margin-top: 10px;
    border-radius: 6px;
  }

  .empty {
    color: #aaa;
    text-align: center;
  }

  .timestamp {
    min-width: 130px;
    font-size: 12px;
    color: #666;
  }

  .actions {
    margin-top: 8px;
  }

  .edit-btn {
    background: #007bff;
    margin-right: 5px;
  }

  .delete-btn {
    background: #dc3545;
  }

  .edit-btn:hover {
    background: #0069d9;
  }

  .delete-btn:hover {
    background: #c82333;
  }
</style>
</head>

<body>

<h1>Submit Your Wishlist</h1>

<form id="wishlistForm">

  <label for="Number">Number (1-12):</label>
  <input
    type="number"
    id="Number"
    min="1"
    max="12"
    step="1"
    placeholder="Enter 1-12"
    required
  >

  <!-- WISHLIST 1 -->
  <div class="wish-section">
    <h3>Wishlist 1</h3>

    <label for="description1">Description:</label>
    <textarea id="description1" required
      placeholder="Enter description"></textarea>

    <label for="link1">Link:</label>
    <input type="url" id="link1" required
      placeholder="Paste product link (https://...)">

    <label for="picture1">Picture URL:</label>
    <input type="url" id="picture1" required
      placeholder="Paste image URL (https://...)">
  </div>

  <!-- WISHLIST 2 -->
  <div class="wish-section">
    <h3>Wishlist 2</h3>

    <label for="description2">Description:</label>
    <textarea id="description2" required
      placeholder="Enter description"></textarea>

    <label for="link2">Link:</label>
    <input type="url" id="link2" required
      placeholder="Paste product link (https://...)">

    <label for="picture2">Picture URL:</label>
    <input type="url" id="picture2" required
      placeholder="Paste image URL (https://...)">
  </div>

  <!-- WISHLIST 3 -->
  <div class="wish-section">
    <h3>Wishlist 3</h3>

    <label for="description3">Description:</label>
    <textarea id="description3" required
      placeholder="Enter description"></textarea>

    <label for="link3">Link:</label>
    <input type="url" id="link3" required
      placeholder="Paste product link (https://...)">

    <label for="picture3">Picture URL:</label>
    <input type="url" id="picture3" required
      placeholder="Paste image URL (https://...)">
  </div>

  <button type="submit" id="submitButton">
    Add Wishlist
  </button>

</form>


<h2>All Wishlists</h2>

<div class="table-wrapper">
<table>
  <thead>
    <tr>
      <th>Number</th>
      <th>Wishlist 1</th>
      <th>Wishlist 2</th>
      <th>Wishlist 3</th>
      <th>Timestamp</th>
    </tr>
  </thead>

  <tbody id="wishlistsContainer">
    <tr>
      <td colspan="5" class="empty">Loading...</td>
    </tr>
  </tbody>
</table>
</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  remove
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


// FIREBASE CONFIGURATION

const firebaseConfig = {
  apiKey: "AIzaSyAHZbilFupWzHDpovfLwS_UkeozIqrGaUs",
  authDomain: "wishlist-a9da8.firebaseapp.com",
  databaseURL: "https://wishlist-a9da8-default-rtdb.firebaseio.com",
  projectId: "wishlist-a9da8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const form = document.getElementById("wishlistForm");
const container = document.getElementById("wishlistsContainer");

const wishlistPath = "wishlist_items";


// GET PHILIPPINE TIMESTAMP

function getTimestamp() {
  return new Date().toLocaleString("en-PH", {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: true,
    timeZone: "Asia/Manila"
  });
}


// VALIDATE URL

function safeURL(value) {
  try {
    const url = new URL(value);

    if (url.protocol === "http:" || url.protocol === "https:") {
      return url.href;
    }

    return "";
  } catch {
    return "";
  }
}


// SAVE WISHLIST

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const number = Number(document.getElementById("Number").value);

  if (!Number.isInteger(number) || number < 1 || number > 12) {
    alert("Please enter a whole number from 1 to 12.");
    return;
  }

  const wishes = [];

  for (let i = 1; i <= 3; i++) {

    const description =
      document.getElementById("description" + i).value.trim();

    const link =
      document.getElementById("link" + i).value.trim();

    const picture =
      document.getElementById("picture" + i).value.trim();

    if (!description || !link || !picture) {
      alert("Please complete all fields in Wishlist " + i + ".");
      return;
    }

    const validLink = safeURL(link);
    const validPicture = safeURL(picture);

    if (!validLink || !validPicture) {
      alert("Please enter valid URLs in Wishlist " + i + ".");
      return;
    }

    wishes.push({
      description: description,
      link: validLink,
      picture: validPicture
    });
  }

  const submitButton = document.getElementById("submitButton");
  submitButton.disabled = true;

  try {

    const itemRef = ref(db, wishlistPath + "/" + number);
    const snapshot = await get(itemRef);

    const existing = snapshot.exists() ? snapshot.val() : null;

    const wishlistData = {
      name: String(number),
      wish1: wishes[0],
      wish2: wishes[1],
      wish3: wishes[2],
      timestamp: existing?.timestamp || getTimestamp(),
      updatedAt: existing ? getTimestamp() : null
    };

    await set(itemRef, wishlistData);

    alert("Wishlist Number " + number + " saved successfully!");

    form.reset();

    submitButton.textContent = "Add Wishlist";

    await loadWishlists();

  } catch(error) {

    console.error("Firebase error:", error);
    alert("Unable to save wishlist. Please check Firebase permissions.");

  } finally {

    submitButton.disabled = false;

  }

});


// DISPLAY ONE WISHLIST INSIDE ONE TABLE CELL

function createWishCell(wish) {

  const cell = document.createElement("td");
  cell.className = "wish-cell";

  if (!wish || typeof wish !== "object") {
    cell.innerHTML = '<span class="empty">No entry</span>';
    return cell;
  }

  // Description

  const description = document.createElement("div");
  description.className = "wish-description";
  description.textContent = wish.description || "";

  cell.appendChild(description);

  // Link

  const linkURL = safeURL(wish.link);

  if (linkURL) {

    const link = document.createElement("a");

    link.href = linkURL;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.className = "wish-link";
    link.textContent = "View Link";

    cell.appendChild(link);
  }

  // Picture

  const pictureURL = safeURL(wish.picture);

  if (pictureURL) {

    const image = document.createElement("img");

    image.src = pictureURL;
    image.alt = "Wishlist Picture";
    image.className = "wish-image";
    image.loading = "lazy";

    image.onerror = function() {
      this.alt = "Picture unavailable";
      this.style.display = "none";
    };

    cell.appendChild(image);
  }

  return cell;
}


// LOAD ALL WISHLISTS

async function loadWishlists() {

  try {

    const snapshot = await get(ref(db, wishlistPath));

    const data = snapshot.exists() ? snapshot.val() : {};

    container.innerHTML = "";

    // Always display Numbers 1 to 12

    for (let number = 1; number <= 12; number++) {

      const item = data[number] || null;

      const row = document.createElement("tr");

      // NUMBER

      const numberCell = document.createElement("td");
      numberCell.className = "Number";
      numberCell.textContent = number;

      row.appendChild(numberCell);

      // WISHLIST 1, 2, 3

      row.appendChild(createWishCell(item?.wish1));
      row.appendChild(createWishCell(item?.wish2));
      row.appendChild(createWishCell(item?.wish3));

      // TIMESTAMP

      const timestampCell = document.createElement("td");
      timestampCell.className = "timestamp";

      timestampCell.textContent = item
        ? (item.updatedAt
            ? "Added: " + item.timestamp + "\nUpdated: " + item.updatedAt
            : item.timestamp || "N/A")
        : "N/A";

      row.appendChild(timestampCell);

      container.appendChild(row);

    }

  } catch(error) {

    console.error("Error loading wishlists:", error);

    container.innerHTML =
      '<tr><td colspan="5" class="empty">Unable to load wishlists.</td></tr>';

  }

}


// INITIAL LOAD

loadWishlists();

</script>

</body>
</html>
