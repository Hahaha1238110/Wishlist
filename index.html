```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1, h2 {
      color: #555;
    }

    form {
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 400px;
    }

    label {
      display: block;
      font-size: 16px;
      margin-bottom: 8px;
      text-align: left;
    }

    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    input[type="number"] {
      text-align: center;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      color: #fff;
      background-color: #28a745;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ddd;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      vertical-align: top;
    }

    th {
      background-color: #f4f4f4;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    /* Number column styling */
    th.Number,
    td.Number {
      width: 60px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Date/Time column styling */
    th.date-time,
    td.date-time {
      width: 140px;
      font-size: 12px;
      color: #555;
      white-space: normal;
    }
  </style>
</head>

<body>

  <h1>Submit Your Wishlist</h1>

  <form id="wishlistForm">

    <label for="Number">Number (1-12):</label>
    <input
      type="number"
      id="Number"
      placeholder="Enter 1-12"
      min="1"
      max="12"
      step="1"
      required
    >

    <label for="wish1">Wish 1:</label>
    <textarea
      id="wish1"
      placeholder="Enter your first wish"
      required
    ></textarea>

    <label for="wish2">Wish 2:</label>
    <textarea
      id="wish2"
      placeholder="Enter your second wish"
      required
    ></textarea>

    <label for="wish3">Wish 3:</label>
    <textarea
      id="wish3"
      placeholder="Enter your third wish"
      required
    ></textarea>

    <button type="submit">Add Wishlist</button>

  </form>

  <h2>All Wishlists:</h2>

  <table>
    <thead>
      <tr>
        <th class="Number">Number</th>
        <th>Wish 1</th>
        <th>Wish 2</th>
        <th>Wish 3</th>
        <th class="date-time">Date &amp; Time</th>
      </tr>
    </thead>

    <tbody id="wishlistsContainer">
      <tr>
        <td colspan="5">Loading wishlists...</td>
      </tr>
    </tbody>
  </table>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      get,
      push
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAHZbilFupWzHDpovfLwS_UkeozIqrGaUs",
      authDomain: "wishlist-a9da8.firebaseapp.com",
      databaseURL: "https://wishlist-a9da8-default-rtdb.firebaseio.com",
      projectId: "wishlist-a9da8"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);


    // Submit wishlist
    const wishlistForm = document.getElementById("wishlistForm");

    wishlistForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const numberInput = document.getElementById("Number");
      const name = numberInput.value.trim();

      const number = Number(name);

      const wish1 = document.getElementById("wish1").value.trim();
      const wish2 = document.getElementById("wish2").value.trim();
      const wish3 = document.getElementById("wish3").value.trim();


      // Validate number from 1 to 12
      if (
        name === "" ||
        !Number.isInteger(number) ||
        number < 1 ||
        number > 12
      ) {
        alert("Please enter a whole number from 1 to 12.");
        numberInput.focus();
        return;
      }


      // Validate wishlist fields
      if (!wish1 || !wish2 || !wish3) {
        alert("Please fill in all wishlist fields.");
        return;
      }


      // Format date and time using Philippine time
      const now = new Date();

      const options = {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true,
        timeZone: "Asia/Manila"
      };

      const formattedDate = now
        .toLocaleString("en-PH", options)
        .replace(",", "");


      // Save wishlist to Firebase
      const wishlistRef = ref(db, "wishlists");

      try {

        await push(wishlistRef, {
          name: String(number),
          wish1: wish1,
          wish2: wish2,
          wish3: wish3,
          timestamp: formattedDate
        });

        alert("Wishlist saved successfully!");

        wishlistForm.reset();

        await loadWishlists();

      } catch (error) {

        console.error("Error saving wishlist:", error);

        alert("Unable to save wishlist. Please check your internet connection and Firebase database permissions.");

      }

    });


    // Load wishlists from Firebase
    async function loadWishlists() {

      const wishlistsRef = ref(db, "wishlists");
      const container = document.getElementById("wishlistsContainer");

      try {

        const snapshot = await get(wishlistsRef);

        container.innerHTML = "";

        if (snapshot.exists()) {

          const data = snapshot.val();

          for (const key in data) {

            const item = data[key];

            const row = document.createElement("tr");


            // Number column
            const numberCell = document.createElement("td");
            numberCell.className = "Number";
            numberCell.textContent = item.name ?? "";
            row.appendChild(numberCell);


            // Wish 1 column
            const wish1Cell = document.createElement("td");
            wish1Cell.textContent = item.wish1 ?? "";
            row.appendChild(wish1Cell);


            // Wish 2 column
            const wish2Cell = document.createElement("td");
            wish2Cell.textContent = item.wish2 ?? "";
            row.appendChild(wish2Cell);


            // Wish 3 column
            const wish3Cell = document.createElement("td");
            wish3Cell.textContent = item.wish3 ?? "";
            row.appendChild(wish3Cell);


            // Date and time column
            const dateCell = document.createElement("td");
            dateCell.className = "date-time";
            dateCell.textContent = item.timestamp ?? "N/A";
            row.appendChild(dateCell);


            container.appendChild(row);

          }

        } else {

          container.innerHTML =
            "<tr><td colspan='5'>No wishlists found.</td></tr>";

        }

      } catch (error) {

        console.error("Error loading wishlists:", error);

        container.innerHTML =
          "<tr><td colspan='5'>Unable to load wishlists. Please try again later.</td></tr>";

      }

    }


    // Load wishlists when the page opens
    loadWishlists();

  </script>

</body>
</html>
```
