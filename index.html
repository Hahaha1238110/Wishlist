
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: #f7f7f7;
  color: #333;
}

h1, h2 { text-align: center; }

.form-container {
  max-width: 850px;
  margin: 20px auto;
  padding: 20px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px #00000015;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
  padding: 9px 14px;
  margin-top: 10px;
  border: none;
  border-radius: 5px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:hover { background: #1d4ed8; }

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.add-button {
  background: #15803d;
}

.remove-button {
  background: #dc2626;
  padding: 7px 10px;
  margin-top: 5px;
}

.wishlist-section {
  border-top: 1px solid #ddd;
  margin-top: 25px;
  padding-top: 10px;
}

.entry-group {
  background: #fafafa;
  padding: 12px;
  border: 1px solid #eee;
  border-radius: 7px;
  margin-top: 10px;
}

.image-help {
  font-size: 13px;
  color: #666;
  margin: 6px 0;
}

.image-help a {
  color: #2563eb;
  font-weight: bold;
  text-decoration: none;
}

.image-help a:hover {
  text-decoration: underline;
}

.preview {
  display: none;
  max-width: 130px;
  max-height: 130px;
  object-fit: contain;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 5px;
}

.image-item {
  border-bottom: 1px solid #ddd;
  padding-bottom: 10px;
  margin-bottom: 10px;
}

.image-status {
  font-size: 12px;
  margin-top: 5px;
}

.table-container {
  overflow-x: auto;
  margin-top: 20px;
  background: white;
  border-radius: 8px;
}

table {
  width: 100%;
  min-width: 950px;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ddd;
  padding: 12px;
  text-align: center;
  vertical-align: top;
}

th {
  background: #2563eb;
  color: white;
}

.wishlist-cell {
  min-width: 200px;
}

.wish-item {
  border-bottom: 1px solid #ddd;
  padding: 10px 0;
  margin-bottom: 8px;
}

.wish-item:last-child {
  border-bottom: none;
}

.wish-item img {
  display: block;
  max-width: 120px;
  max-height: 120px;
  object-fit: contain;
  margin: 8px auto;
}

.wish-links a {
  display: block;
  margin: 5px 0;
  word-break: break-word;
}

.empty { color: #999; }

.status {
  margin-top: 10px;
  font-size: 14px;
}

.success { color: green; }
.error { color: red; }

.help-text {
  color: #666;
  font-size: 12px;
  line-height: 1.5;
}
</style>
</head>

<body>

<h1>My Wishlist</h1>

<div class="form-container">

<form id="wishlistForm">

<label for="number">Number (1–12)</label>
<input type="number" id="number" min="1" max="12"
       step="1" required>

<div id="wishlistForms"></div>

<p class="help-text">
  You can add multiple links and pictures for each wishlist.
  For pictures, use direct image URLs from ImageToURLs.
</p>

<button type="submit" id="saveButton">Save Wishlist</button>

<p id="status" class="status"></p>

</form>
</div>

<h2>Wishlist Records</h2>

<div class="table-container">
<table>
<thead>
<tr>
  <th>Number</th>
  <th>Wishlist 1</th>
  <th>Wishlist 2</th>
  <th>Wishlist 3</th>
  <th>Timestamp</th>
</tr>
</thead>

<tbody id="wishlistTable">
<tr><td colspan="5">Loading...</td></tr>
</tbody>
</table>
</div>


<script type="module">

// =====================================
// FIREBASE IMPORTS
// =====================================

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue
} from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


// =====================================
// FIREBASE CONFIGURATION
// =====================================

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://wishlist-a9da8-default-rtdb.firebaseio.com",
  projectId: "wishlist-a9da8",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const wishlistRef = ref(db, "wishlist_items");


// =====================================
// ELEMENTS
// =====================================

const form = document.getElementById("wishlistForm");
const wishlistForms = document.getElementById("wishlistForms");
const tableBody = document.getElementById("wishlistTable");
const saveButton = document.getElementById("saveButton");
const status = document.getElementById("status");


// =====================================
// CREATE THREE WISHLIST FORMS
// =====================================

for (let i = 1; i <= 3; i++) {

  const section = document.createElement("div");

  section.className = "wishlist-section";
  section.id = `wishlistSection${i}`;

  section.innerHTML = `
    <h3>Wishlist ${i}</h3>

    <label>Description</label>
    <input type="text" id="description${i}" required>

    <div class="entry-group">
      <strong>Links</strong>
      <div id="links${i}"></div>
      <button type="button" class="add-button"
        id="addLink${i}">
        + Add Link
      </button>
    </div>

    <div class="entry-group">
      <strong>Pictures</strong>

      <p class="image-help">
        Don't have an image URL?
        <a href="https://imagetourls.com/"
           target="_blank"
           rel="noopener noreferrer">
          Upload your image here and get a URL
        </a>
      </p>

      <div id="pictures${i}"></div>

      <button type="button" class="add-button"
        id="addPicture${i}">
        + Add Picture
      </button>
    </div>
  `;

  wishlistForms.appendChild(section);

}


// =====================================
// URL VALIDATION
// =====================================

function isValidWebURL(value) {

  try {
    const url = new URL(value);

    return url.protocol === "https:" ||
           url.protocol === "http:";

  } catch {
    return false;
  }

}


// =====================================
// TEST IMAGE URL
// =====================================

function testImageURL(value) {

  return new Promise((resolve) => {

    const image = new Image();

    image.onload = () => resolve(true);
    image.onerror = () => resolve(false);

    image.src = value;

  });

}


// =====================================
// ADD LINK FIELD
// =====================================

function addLinkField(number, value = "") {

  const container =
    document.getElementById(`links${number}`);

  const item = document.createElement("div");

  item.className = "link-item";

  const input = document.createElement("input");

  input.type = "url";
  input.placeholder = "https://example.com";
  input.required = true;
  input.value = value;

  const remove = document.createElement("button");

  remove.type = "button";
  remove.className = "remove-button";
  remove.textContent = "Remove Link";

  remove.addEventListener("click", () => {
    item.remove();
  });

  item.appendChild(input);
  item.appendChild(remove);

  container.appendChild(item);

}


// =====================================
// ADD PICTURE FIELD
// =====================================

function addPictureField(number, value = "") {

  const container =
    document.getElementById(`pictures${number}`);

  const item = document.createElement("div");

  item.className = "image-item";

  const input = document.createElement("input");

  input.type = "url";
  input.placeholder = "Paste direct image URL here";
  input.required = true;
  input.value = value;

  const preview = document.createElement("img");

  preview.className = "preview";
  preview.alt = "Image preview";

  const imageStatus = document.createElement("div");

  imageStatus.className = "image-status";

  const remove = document.createElement("button");

  remove.type = "button";
  remove.className = "remove-button";
  remove.textContent = "Remove Picture";

  async function checkImage() {

    const url = input.value.trim();

    preview.style.display = "none";
    preview.src = "";
    imageStatus.textContent = "";

    if (!url) return;

    if (!isValidWebURL(url)) {

      imageStatus.textContent =
        "Please enter a valid HTTP or HTTPS URL.";

      imageStatus.className = "image-status error";
      return;
    }

    imageStatus.textContent = "Checking image...";

    const valid = await testImageURL(url);

    if (valid) {

      preview.src = url;
      preview.style.display = "block";

      imageStatus.textContent = "Image loaded successfully.";
      imageStatus.className = "image-status success";

    } else {

      imageStatus.textContent =
        "Image unavailable. Please use a direct image URL.";

      imageStatus.className = "image-status error";

    }
  }

  input.addEventListener("change", checkImage);

  remove.addEventListener("click", () => {
    item.remove();
  });

  item.appendChild(input);
  item.appendChild(preview);
  item.appendChild(imageStatus);
  item.appendChild(remove);

  container.appendChild(item);

  if (value) checkImage();

}


// =====================================
// INITIALIZE FIELDS
// =====================================

for (let i = 1; i <= 3; i++) {

  addLinkField(i);
  addPictureField(i);

  document.getElementById(`addLink${i}`)
    .addEventListener("click", () => addLinkField(i));

  document.getElementById(`addPicture${i}`)
    .addEventListener("click", () => addPictureField(i));

}


// =====================================
// COLLECT WISHLIST DATA
// =====================================

async function collectWishlist(number) {

  const wishes = [];

  for (let i = 1; i <= 3; i++) {

    const description =
      document.getElementById(`description${i}`)
        .value.trim();

    const linkInputs =
      document.querySelectorAll(`#links${i} input`);

    const pictureInputs =
      document.querySelectorAll(`#pictures${i} input`);

    if (!description) {
      throw new Error(`Please enter Wishlist ${i} description.`);
    }

    const links = Array.from(linkInputs)
      .map(input => input.value.trim())
      .filter(Boolean);

    const pictures = Array.from(pictureInputs)
      .map(input => input.value.trim())
      .filter(Boolean);

    if (links.length === 0) {
      throw new Error(`Please add at least one link to Wishlist ${i}.`);
    }

    if (pictures.length === 0) {
      throw new Error(`Please add at least one picture to Wishlist ${i}.`);
    }

    for (const link of links) {

      if (!isValidWebURL(link)) {
        throw new Error(`Wishlist ${i} contains an invalid link.`);
      }

    }

    for (const picture of pictures) {

      if (!isValidWebURL(picture)) {
        throw new Error(`Wishlist ${i} contains an invalid picture URL.`);
      }

    }

    wishes.push({
      description,
      links,
      pictures
    });

  }

  // Verify that every picture can actually load.
  for (let i = 0; i < wishes.length; i++) {

    for (let j = 0; j < wishes[i].pictures.length; j++) {

      status.textContent =
        `Checking Wishlist ${i + 1}, picture ${j + 1}...`;

      const valid = await testImageURL(
        wishes[i].pictures[j]
      );

      if (!valid) {
        throw new Error(
          `Wishlist ${i + 1}, picture ${j + 1} cannot be loaded. ` +
          `Please check the image URL.`
        );
      }

    }

  }

  return wishes;

}


// =====================================
// SAVE OR UPDATE WISHLIST
// =====================================

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  const number = Number(
    document.getElementById("number").value
  );

  if (!Number.isInteger(number) || number < 1 || number > 12) {

    alert("Please enter a whole number from 1 to 12.");
    return;

  }

  saveButton.disabled = true;
  saveButton.textContent = "Checking...";

  try {

    const wishes = await collectWishlist(number);

    status.textContent = "Saving wishlist...";

    const record = {

      number,

      wish1: wishes[0],
      wish2: wishes[1],
      wish3: wishes[2],

      timestamp: new Date().toLocaleString("en-PH", {
        timeZone: "Asia/Manila"
      }),

      updatedAt: Date.now()

    };

    // Existing number is updated, not duplicated.
    await set(
      ref(db, `wishlist_items/${number}`),
      record
    );

    status.textContent =
      `Wishlist for Number ${number} saved successfully!`;

    status.className = "status success";

    form.reset();

    // Restore one empty link and picture field per wishlist.
    for (let i = 1; i <= 3; i++) {

      document.getElementById(`links${i}`).innerHTML = "";
      document.getElementById(`pictures${i}`).innerHTML = "";

      addLinkField(i);
      addPictureField(i);

    }

  } catch (error) {

    console.error(error);

    status.textContent =
      error.message || "Unable to save wishlist.";

    status.className = "status error";

  } finally {

    saveButton.disabled = false;
    saveButton.textContent = "Save Wishlist";

  }

});


// =====================================
// DISPLAY WISHLIST TABLE
// =====================================

function renderTable(data) {

  tableBody.innerHTML = "";

  for (let number = 1; number <= 12; number++) {

    const record = data[number];

    const row = document.createElement("tr");

    const numberCell = document.createElement("td");
    numberCell.textContent = number;

    row.appendChild(numberCell);

    for (let i = 1; i <= 3; i++) {

      const cell = document.createElement("td");
      cell.className = "wishlist-cell";

      const wish = record?.[`wish${i}`];

      if (wish) {

        const item = document.createElement("div");
        item.className = "wish-item";

        const description = document.createElement("strong");
        description.textContent = wish.description || "";

        item.appendChild(description);

        // Multiple clickable links.
        const linksContainer = document.createElement("div");
        linksContainer.className = "wish-links";

        const links = Array.isArray(wish.links)
          ? wish.links
          : (wish.link ? [wish.link] : []);

        links.forEach((url, index) => {

          if (!isValidWebURL(url)) return;

          const link = document.createElement("a");

          link.href = url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = `View Link ${index + 1}`;

          linksContainer.appendChild(link);

        });

        item.appendChild(linksContainer);

        // Multiple images.
        const pictures = Array.isArray(wish.pictures)
          ? wish.pictures
          : (wish.picture ? [wish.picture] : []);

        pictures.forEach((url) => {

          if (!isValidWebURL(url)) return;

          const image = document.createElement("img");

          image.src = url;
          image.alt = wish.description || "Wishlist image";
          image.loading = "lazy";

          image.onerror = () => {
            image.remove();
          };

          item.appendChild(image);

        });

        cell.appendChild(item);

      } else {

        const empty = document.createElement("span");

        empty.className = "empty";
        empty.textContent = "—";

        cell.appendChild(empty);

      }

      row.appendChild(cell);

    }

    const timestampCell = document.createElement("td");

    timestampCell.textContent =
      record?.timestamp || "—";

    row.appendChild(timestampCell);

    tableBody.appendChild(row);

  }

}


// =====================================
// REAL-TIME FIREBASE LISTENER
// =====================================

onValue(

  wishlistRef,

  (snapshot) => {
    renderTable(snapshot.val() || {});
  },

  (error) => {

    tableBody.innerHTML = "";

    const row = document.createElement("tr");
    const cell = document.createElement("td");

    cell.colSpan = 5;
    cell.textContent =
      "Unable to load data: " + error.message;

    row.appendChild(cell);
    tableBody.appendChild(row);

  }

);

</script>

</body>
</html>
